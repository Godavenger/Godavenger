name: Refresh public activity

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update-activity.mjs
      - scripts/activity.test.mjs
      - .github/workflows/activity.yml

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Check calendar parsing
        run: node --test scripts/activity.test.mjs
      - name: Refresh from the public GitHub calendar
        run: node scripts/update-activity.mjs
      - name: Save changed activity
        run: |
          git add assets/activity.svg data/activity.json
          if git diff --cached --quiet; then
            echo "Public activity is already current."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh public activity chart'
          git pull --rebase
          git push
