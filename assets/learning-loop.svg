<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="170" viewBox="0 0 1000 170" role="img" aria-labelledby="title description">
  <title id="title">Learn → Experiment → Build → Improve</title>
  <desc id="description">A continuous learning loop: explore foundations, test ideas, make useful things, and refine through reflection. The final step connects back to learning.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0c1721"/>
      <stop offset="1" stop-color="#070d14"/>
    </linearGradient>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1L4 3L1 5" fill="none" stroke="#648e9c" stroke-width="1"/>
    </marker>
    <style>
      .sans { font-family: 'Segoe UI', Arial, sans-serif; }
      .mono { font-family: 'Cascadia Code', Consolas, monospace; }
      .flow { stroke-dasharray: 5 45; animation: flow 12s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -100; } }
      @media (prefers-reduced-motion: reduce) { .flow { animation: none !important; } }
    </style>
  </defs>

  <rect x=".5" y=".5" width="999" height="169" rx="12" fill="url(#background)" stroke="#223341"/>
  <text x="35" y="27" class="mono" font-size="9" letter-spacing="1.8" fill="#7596a4">THE LEARNING LOOP</text>
  <text x="965" y="27" text-anchor="end" class="mono" font-size="9" letter-spacing="1.5" fill="#587886">CURIOSITY → PRACTICE</text>

  <g fill="none" stroke="#355966" stroke-width="1" marker-end="url(#arrow)">
    <path d="M201 74H278"/>
    <path d="M471 74H528"/>
    <path d="M700 74H778"/>
    <path d="M936 104V122Q936 139 919 139H68Q53 139 53 124V113"/>
  </g>
  <g class="flow" fill="none" stroke="#79dce7" stroke-width="1" stroke-opacity=".7" aria-hidden="true">
    <path d="M201 74H274M471 74H524M700 74H774"/>
  </g>

  <g class="sans">
    <g>
      <circle cx="53" cy="74" r="16" fill="#10252e" stroke="#38616f"/>
      <text x="53" y="78" text-anchor="middle" class="mono" font-size="10" fill="#7ce0e9">01</text>
      <text x="81" y="81" font-size="22" font-weight="600" letter-spacing=".7" fill="#e2f0f6">LEARN</text>
      <text x="81" y="106" font-size="12" fill="#8ca6b5">Explore foundations</text>
    </g>
    <g>
      <circle cx="303" cy="74" r="16" fill="#10252e" stroke="#38616f"/>
      <text x="303" y="78" text-anchor="middle" class="mono" font-size="10" fill="#7ce0e9">02</text>
      <text x="331" y="81" font-size="22" font-weight="600" letter-spacing=".7" fill="#e2f0f6">EXPERIMENT</text>
      <text x="331" y="106" font-size="12" fill="#8ca6b5">Test ideas. Ask why.</text>
    </g>
    <g>
      <circle cx="553" cy="74" r="16" fill="#10252e" stroke="#38616f"/>
      <text x="553" y="78" text-anchor="middle" class="mono" font-size="10" fill="#7ce0e9">03</text>
      <text x="581" y="81" font-size="22" font-weight="600" letter-spacing=".7" fill="#e2f0f6">BUILD</text>
      <text x="581" y="106" font-size="12" fill="#8ca6b5">Make useful things</text>
    </g>
    <g>
      <circle cx="803" cy="74" r="16" fill="#10252e" stroke="#38616f"/>
      <text x="803" y="78" text-anchor="middle" class="mono" font-size="10" fill="#7ce0e9">04</text>
      <text x="831" y="81" font-size="22" font-weight="600" letter-spacing=".7" fill="#e2f0f6">IMPROVE</text>
      <text x="831" y="106" font-size="12" fill="#8ca6b5">Reflect and refine</text>
    </g>
  </g>
  <rect x="418" y="132" width="164" height="14" fill="#0a131c"/>
  <text x="500" y="142" text-anchor="middle" class="mono" font-size="8" letter-spacing="1.8" fill="#668795">REPEAT WITH INTENT</text>
</svg>
